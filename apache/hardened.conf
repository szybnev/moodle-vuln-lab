# Hardening for the negative-control instance, following the intent of the
# "Hiding internal paths" recommendations in the Moodle security docs:
# deny dot files, dependency manifests, upgrade notes, test fixtures and
# other developer-only files. Written for this lab; not copied from Moodle.
#
# Rules live in <Directory> context because server-level mod_rewrite rules are
# not inherited by the image's <VirtualHost>.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    RewriteEngine On
    RewriteRule "(^|/)\.(?!well-known/)" - [F]
    RewriteRule "(^|/)(composer\.(json|lock)|package(-lock)?\.json|npm-shrinkwrap\.json)$" - [F]
    RewriteRule "(^|/)(Gruntfile\.js|phpunit\.xml(\.dist)?|behat\.yml(\.dist)?|phpcs\.xml(\.dist)?)$" - [F]
    RewriteRule "(^|/)(upgrade\.txt|UPGRADING\.md|README(\.md|\.txt)?|readme(\.md|\.txt)?|environment\.xml|install\.xml|thirdpartylibs\.xml)$" - [F]
    RewriteRule "(^|/)(tests|fixtures|behat|node_modules|vendor)/" - [F]
    RewriteRule "\.(feature|dist|lock|bak|old|orig|save|swp|sql)$" - [F]
    RewriteRule "~$" - [F]
    # Moodle 5.1+ routing: unknown paths go through the router.
    FallbackResource /r.php
</Directory>
